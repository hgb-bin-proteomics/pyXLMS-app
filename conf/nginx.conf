html {
  server {
    server_name pyxlms.projekte.fh-hagenberg.at;
    location / {
      proxy_pass http://localhost:8501;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_read_timeout 86400;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pyxlms.projekte.fh-hagenberg.at/fullchain.pem; # managed by Certb>
    ssl_certificate_key /etc/letsencrypt/live/pyxlms.projekte.fh-hagenberg.at/privkey.pem; # managed by Cer>
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
  }
  server {
    if ($host = pyxlms.projekte.fh-hagenberg.at) {
      return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name pyxlms.projekte.fh-hagenberg.at;
    return 404; # managed by Certbot
  }
  server {
    listen 80;
    server_name 193.170.237.126;
    location / {
      proxy_pass http://localhost:8501;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 86400;
    }
  }
}
